name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Tests (Linux, race detector) + Windows build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet -unsafeptr=false ./...
      - name: Tests
        run: go test -race -count=1 ./...
      - name: Fuzz (30 s each)
        run: |
          for f in FuzzParseQueue FuzzParseSearch FuzzLocalAndMerge FuzzManifest FuzzVersions FuzzSecrets FuzzSearchTyping FuzzParseLRC FuzzSearchURL; do
            go test -run=NONE -fuzz="^$f\$" -fuzztime=30s . || exit 1
          done
      - name: Build Orbit.exe
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui" -o Orbit.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-exe
          path: Orbit.exe

  windows:
    name: Tests + smoke test on real Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Tests (with Windows' own encryption, files and paths)
        run: go test -count=1 ./...
      - name: Build
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o Orbit.exe .
      - name: Smoke test - drive Orbit through its settings, full screen and widgets
        shell: pwsh
        run: ./.github/smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          path: |
            ${{ runner.temp }}/appdata/OrbitLyrics/*.log
            shots/*.png
          if-no-files-found: ignore

  mac:
    name: Tests, build and smoke test on a real Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet
        run: go vet ./...
      - name: Tests (with the Mac's own Keychain, files and paths)
        run: go test -count=1 ./...
      - name: Build Orbit.app (Apple Silicon + Intel)
        run: tools/mac/bundle.sh
      - name: Smoke test - start Orbit.app, drive its settings, talk to Apple Music, quit
        run: tools/mac/smoke.sh
