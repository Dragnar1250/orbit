necap%3D%22round%22/%3E%3Cline%20x1%3D%22174.0%22%20y1%3D%2289.4%22%20x2%3D%22196.2%22%20y2%3D%2270.7%22%20stroke%3D%22url%28%23a%29%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22/%3E%3Cline%20x1%3D%22180.0%22%20y1%3D%2298.0%22%20x2%3D%22198.8%22%20y2%3D%2287.1%22%20stroke%3D%22url%28%23a%29%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22/%3E%3Cline%20x1%3D%22184.4%22%20y1%3D%22107.5%22%20x2%3D%22213.6%22%20y2%3D%2296.8%22%20stroke%3D%22url%28%23a%29%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22/%3E%3Cline%20x1%3D%22187.1%22%20y1%3D%22117.6%22%20x2%3D%22214.1%22%20y2%3D%22112.8%22%20stroke%3D%22url%28%23a%29%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%22128%22%20cy%3D%22128%22%20r%3D%2242%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%229%22/%3E%3Ccircle%20cx%3D%22164%22%20cy%3D%2298%22%20r%3D%228%22%20fill%3D%22%23fff%22/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#09090c;--panel:#0c0c10;--card:#121217;--card2:#16161c;--line:#1f1f27;--line2:#2b2b35;--text:#ececf1;--dim:#8a8a96;--dim2:#5f5f6b;--acc:#e8b04a;
  --stage:radial-gradient(ellipse at 22% 0,#3d2c7d 0,transparent 62%),radial-gradient(ellipse at 88% 100%,#1b4a6e 0,transparent 58%),#111118}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:190px 1fr;grid-template-rows:46px 1fr;height:100vh}
/* top bar */
.top{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.logoimg{width:26px;height:26px;flex:none;filter:drop-shadow(0 2px 6px #3ee8ff33)}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.logo i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,#2a2a33 19% 40%,#0d0d10 41%);box-shadow:0 0 0 1px #3a3a46}
.pill{font-size:11px;color:var(--dim);border:1px solid var(--line2);border-radius:99px;padding:2px 9px;white-space:nowrap}
.npill{margin:0 auto;display:flex;align-items:center;gap:9px;background:#141419;border:1px solid var(--line2);border-radius:99px;padding:4px 14px 4px 4px;max-width:340px;min-width:180px}
.npill .art{width:26px;height:26px;border-radius:50%;background:#26262e center/cover;flex:none}
.npill .tx{min-width:0;font-size:11px;line-height:1.2}
.npill .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npill .tx span{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.conn{font-size:11px;color:var(--dim);border:1px solid var(--line2);border-radius:99px;padding:3px 10px;white-space:nowrap}
.conn.ok::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#3ddc84;margin-right:6px;vertical-align:1px}
.conn.bad{background:#3a1820;border-color:#5a2430;color:#ffb3bd}
/* side bar */
aside.nav{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 8px;min-height:0}
nav button{all:unset;display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:7px 10px;border-radius:7px;color:var(--dim);cursor:pointer;margin-bottom:1px;font-size:13px}
nav button:hover{color:var(--text)}
nav button.on{background:#1c1c23;color:var(--text);font-weight:600}
nav .ico{width:16px;text-align:center;opacity:.8;font-size:12px}
.now{margin-top:auto;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:10px;display:flex;gap:9px;align-items:center}
.now .art{width:36px;height:36px;border-radius:7px;flex:none;background:#24242c center/cover}
.now .txt{min-width:0}
.now .t{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .a{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .s{margin-top:3px;font-size:10px;color:var(--dim)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#555;margin-right:5px;vertical-align:1px}
.dot.on{background:#3ddc84}
/* content */
.content{display:grid;grid-template-columns:1fr;min-height:0;overflow:hidden}
.content.has-side{grid-template-columns:1fr 280px}
main{overflow:auto;padding:22px 28px 60px;min-width:0}
.side{border-left:1px solid var(--line);padding:18px 16px;overflow:auto;display:none}
.has-side .side{display:block}
@media (max-width:1100px){.content.has-side{grid-template-columns:1fr}.has-side .side{display:none}}
section{display:none;max-width:860px}section.on{display:block}
.crumb{all:unset;cursor:pointer;color:var(--dim);font-size:12px;display:inline-flex;gap:6px;align-items:center;margin-bottom:6px}
.crumb:hover{color:var(--text)}
h1{font-size:19px;font-weight:600;margin:0 0 14px}
h3{font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin:26px 0 4px}
.lede,.sub{color:var(--dim);max-width:520px;margin:0 0 12px;font-size:12px}
/* rows */
.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:6px}
.row .l{min-width:0;flex:1}.row .l b{display:block;font-weight:600;font-size:12.5px}.row .l small{color:var(--dim);font-size:11px;display:block}
.row.sl{display:block}
.row.sl .hd{display:flex;justify-content:space-between;align-items:baseline}
.row.sl .hd b{font-weight:600;font-size:12.5px}
.row.sl output{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
.row.sl small{color:var(--dim);font-size:11px;display:block;margin-top:2px}
.sw{position:relative;width:34px;height:20px;flex:none;cursor:pointer;order:-1}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw span{position:absolute;inset:0;background:#2c2c36;border-radius:99px;transition:.18s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#9a9aa6;transition:.18s}
.sw input:checked+span{background:#ececf1}
.sw input:checked+span::after{left:17px;background:#0c0c10}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:8px 0 0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,#d8d8e0 var(--p,50%),#2c2c36 var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-5.5px;box-shadow:0 0 0 3px #0009}
/* segmented controls */
.chips{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px}
.chip{all:unset;cursor:pointer;padding:5px 11px;border-radius:6px;color:var(--dim);font-size:12px;white-space:nowrap}
.chip:hover{color:var(--text)}
.chip.on{background:#24242c;color:var(--text);font-weight:600}
.chips.wrap{display:flex;background:none;border:0;padding:0;gap:6px}
.chips.wrap .chip{background:var(--card);border:1px solid var(--line)}
.chips.wrap .chip.on{border-color:#fff;background:var(--card2)}
/* tiles (styles, records, visualizers) */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tile{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;transition:border-color .15s}
.tile:hover{border-color:var(--line2)}
.tile.on,.card.on{border-color:#fff;box-shadow:0 0 0 1px #fff,0 0 22px #ffffff14}
.tile .pv{height:62px;border-radius:7px;background:#0c0c11;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;position:relative;font-family:Consolas,monospace;font-weight:700;color:#fff;font-size:10px;text-align:center;line-height:1.15;padding:4px}
.tile .nm,.card .nm{font-size:11.5px;margin:6px 2px 1px;font-weight:600}
.tile small{display:block;color:var(--dim);font-size:10px;margin:0 2px 2px;line-height:1.25}
.card{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px}
.card .pv{height:62px;border-radius:7px;background:#0c0c11;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;position:relative;font-family:Consolas,monospace;font-weight:700;color:#fff;font-size:10px;text-align:center;line-height:1.15;padding:4px}
.pv .dim{opacity:.35;font-size:8px;font-weight:400}.pv .big{font-size:15px}
.pv .acc{color:var(--acc)}.pv .sm{font-size:8px;opacity:.8}
.pv .neon{color:#ffd6f5;text-shadow:0 0 4px #ff4fd8,0 0 10px #ff4fd8}
.pv .scat span{position:absolute}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
/* colour swatches */
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{all:unset;cursor:pointer;width:72px;text-align:center;font-size:10px;color:var(--dim);border-radius:8px;padding:4px;border:1px solid transparent}
.swatch i{display:block;height:18px;border-radius:6px;margin-bottom:4px;border:1px solid #0006}
.swatch.on{border-color:#fff;color:var(--text)}
.theme{}
/* previews */
#preview,.stage{height:170px;border-radius:12px;border:1px solid var(--line);background:var(--stage);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#preview .lyr{text-align:center;max-width:88%;transition:opacity .2s}
#preview .prev{font-size:.42em;opacity:.55;font-weight:400;margin-bottom:.3em}
#preview .tag,.stage .tag{position:absolute;left:12px;bottom:9px;font-size:10px;color:var(--dim)}
.lyr.mo1{animation:pulse 0.5s ease-in-out infinite alternate}
.lyr.mo2{animation:stretch 0.5s ease-in-out infinite alternate}
.lyr.mo3{animation:glowp 0.5s ease-in-out infinite alternate}
.lyr.mo4{animation:haze 2.4s ease-in-out infinite}
@keyframes pulse{to{transform:scale(1.06)}}
@keyframes stretch{to{transform:scale(1.1,.96)}}
@keyframes glowp{to{filter:drop-shadow(0 0 8px #fff8)}}
.ball{position:absolute;left:0;top:0;width:12px;height:12px;border-radius:50%}
.drawline{stroke-dasharray:1;stroke-dashoffset:1;animation:drawl .35s ease-out forwards}
@keyframes drawl{to{stroke-dashoffset:0}}
.starpop{animation:starpop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes starpop{from{transform:scale(.3);opacity:0}}
@keyframes spring{40%{transform:translateY(-.25em) scale(1.08)}}

.upbox .upstat{display:flex;align-items:center;gap:10px;flex:1;font-size:13px}.upbox .upstat small{color:var(--dim)}.upstat.ok .spdot{background:#1ed760;box-shadow:0 0 8px #1ed76088}.upstat.bad .spdot{background:#ff6b7a}.hint.bad{color:#ff8a98}

function render(keepScroll) {
  const y = document.getElementById("main").scrollTop;
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  const cur = PAGES.find(p => p.id === current) || PAGES[0];
  for (const p of PAGES.filter(p => !p.parent)) nav.append(h("button", { class: p.id === (cur.parent || cur.id) ? "on" : "", "data-page": p.id, on: { click: () => go(p.id) } }, h("span", { class: "ico" }, p.ico), p.title));
  document.getElementById("ver").textContent = "v" + S.version;
  const main = document.getElementById("main");
  main.innerHTML = "";
  const s = h("section", { class: "on", id: "page-" + cur.id });
  s.append(...cur.build().filter(x => x != null));
  main.append(s);
  main.scrollTop = keepScroll ? y : 0;
  updatePreview();
  updateSide();
}

function showNow(n) {
  const prev = S && S.now ? S.now.coverVer : null;
  if (S) S.now = n;
  document.getElementById("nowT").textContent = n.title || T("Nothing playing");
  document.getElementById("nowA").textContent = n.title ? n.artist : T("Play something on Spotify");
  document.getElementById("nowS").innerHTML = n.title ? `<span class="dot ${n.playing ? "on" : ""}"></span>${n.playing ? "Playing" : "Paused"} · ${n.exact ? "exact sync" : "estimated sync"}` : "";
  document.getElementById("pillT").textContent = n.title || T("Nothing playing");
  document.getElementById("pillA").textContent = n.title ? n.artist : T("Play something on Spotify");
  const bg = n.cover ? `url('${coverURL()}')` : "";
  document.getElementById("nowArt").style.backgroundImage = bg;
  document.getElementById("pillArt").style.backgroundImage = bg;
  sampleAlbum();
  if (n.coverVer !== prev) refreshLive();
}

// dark / light: "Like Windows" follows the system setting live
const lightMQ = matchMedia("(prefers-color-scheme: light)");
function applyTheme() {
  const m = C ? C.UITheme : 0, light = m === 2 || (m === 0 && lightMQ.matches), t = light ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("orbitTheme", t); } catch (e) {}
  const b = document.getElementById("themeBtn");
  if (b) { b.textContent = light ? "☀" : "☾"; b.title = "Appearance: " + (S ? S.lists.uiThemes[m] : "") + " — click to switch"; }
}
lightMQ.addEventListener("change", applyTheme);
document.getElementById("themeBtn").addEventListener("click", () => {
  const light = document.documentElement.dataset.theme === "light";
  set("UITheme", light ? 1 : 2, true); applyTheme(); markChips("UITheme");
});
function updateBox() {
  const u = S.update || {}, box = h("div", { class: "upbox", id: "updateBox" });
  let line, cls = "";
  if (u.checking) line = "Looking for updates…";
  else if (u.downloading) line = Tx("Downloading {x}", u.version) + ` · ${Math.round((u.progress || 0) * 100)}%`;
  else if (u.ready) { line = T("Orbit {v} is ready").replace("{v}", u.version); cls = "ok"; }
  else if (u.version) line = T("Orbit {v} is out").replace("{v}", u.version);
  else if (u.error) { line = T(u.error); cls = "bad"; }
  else if (u.upToDate) { line = T("You're on the newest version ({v})").replace("{v}", u.current); cls = "ok"; }
  else line = T("Version {n}").replace("{n}", u.current || S.version);
  const when = u.lastCheck ? Tx("Last checked {x}", new Date(u.lastCheck * 1000).toLocaleTimeString(LOCALE, { hour: "2-digit", minute: "2-digit" })) : "Not checked yet";
  const stat = h("div", { class: "upstat " + cls, id: "upStatus" }, h("span", { class: "spdot" }), h("span", {}, h("b", {}, line), h("br"), h("small", {}, when)));
  const btn = u.ready
    ? h("button", { class: "btn primary", id: "upInstall", on: { click: () => { action("updateInstall", true); btn.textContent = "Restarting…"; btn.disabled = true; } } }, "Update now")
    : h("button", { class: "btn", id: "upCheck", disabled: !!(u.checking || u.downloading), on: { click: () => { action("updateCheck", true).then(() => pollUpdate(0)); } } }, "Check now");
  box.append(h("div", { class: "row btnr" }, stat, btn));
  if (u.notes && (u.ready || u.version)) box.append(h("p", { class: "hint", id: "upNotes", translate: "no" }, T("What's new:") + " " + u.notes));
  if (u.error && u.version) box.append(h("p", { class: "hint bad" }, u.error));
  return box;
}
async function pollUpdate(n) {
  try { const st = await api("/api/state"); S.update = st.update; const old = document.getElementById("updateBox"); if (old) old.replaceWith(updateBox());
    if ((st.update.checking || st.update.downloading) && n < 600) setTimeout(() => pollUpdate(n + 1), 500); } catch (e) {}
}
function spotifyBox() {
  const sp = S.spotify || {}, box = h("div", { class: "spbox", id: "spotifyBox" });
  const status = h("div", { class: "spstat " + (sp.connected ? "ok" : ""), id: "spStatus" },
    h("span", { class: "spdot" }), sp.connected ? (sp.error ? T("Connected — last try:") + " " + T(sp.error) : sp.control ? "Connected · your queue, search, shuffle and repeat work in full screen" : "Connected · press Connect again so search can play songs and shuffle works") : "Not connected");
  const id = h("input", { type: "text", id: "spClient", spellcheck: "false", autocomplete: "off", placeholder: "Client ID — 32 letters and numbers", value: C.SpotifyClientID || "",
    on: { change: e => { const v = e.target.value.trim(); C.SpotifyClientID = v; set("SpotifyClientID", v, true); setTimeout(reloadSpotify, 400); } } });
  const connect = h("button", { class: "btn primary", id: "spConnect", on: { click: () => {
    const v = id.value.trim();
    if (!/^[A-Za-z0-9]{16,64}$/.test(v)) { id.focus(); id.classList.add("bad"); return; }
    id.classList.remove("bad");
    const go = () => { window.open("/spotify/login?t=" + encodeURIComponent(TOKEN), "_blank"); setTimeout(reloadSpotify, 4000); };
    if (v !== C.SpotifyClientID) { C.SpotifyClientID = v; set("SpotifyClientID", v, true); setTimeout(go, 500); } else go();
  } } }, sp.connected ? "Connect again" : "Connect Spotify");
  const off = h("button", { class: "btn danger", id: "spDisconnect", style: sp.connected ? "" : "display:none", on: { click: () => action("spotifyDisconnect", true).then(reloadSpotify) } }, "Disconnect");
  const redirect = h("code", { id: "spRedirect" }, sp.redirect || "");
  const copy = h("button", { class: "btn", on: { click: () => { navigator.clipboard && navigator.clipboard.writeText(sp.redirect || ""); copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1200); } } }, "Copy");
  const steps = h("details", { class: "spsteps", open: !C.SpotifyClientID },
    h("summary", {}, "How to connect (2 minutes, once · needs Spotify Premium)"),
    h("ol", {},
      h("li", {}, "Open ", h("b", {}, "developer.spotify.com/dashboard"), ", sign in and press ", h("b", {}, "Create app"), "."),
      h("li", {}, "Any name (e.g. Orbit). Tick ", h("b", {}, "Web API"), ". As ", h("b", {}, "Redirect URI"), " add exactly: ", redirect, " ", copy),
      h("li", {}, "Save, open the app's ", h("b", {}, "Settings"), " and copy the ", h("b", {}, "Client ID"), " here."),
      h("li", {}, "Spotify only lets Premium accounts make these personal apps (their rule since February 2026)."),
      h("li", {}, "Press ", h("b", {}, "Connect Spotify"), " and allow it. Orbit reads what is playing and what comes next, and can play, queue, shuffle and repeat songs — nothing else: no playlists, no library, no account details.")));
  box.append(status, h("div", { class: "row sprow" }, id, connect, off), steps);
  return box;
}
async function reloadSpotify() {
  try { const st = await api("/api/state"); S.spotify = st.spotify; const old = document.getElementById("spotifyBox"); if (old) old.replaceWith(spotifyBox()); } catch (e) {}
}
function markChips(key) { document.querySelectorAll(`.chips[data-key="${key}"]`).forEach(w => [...w.children].forEach((c, i) => c.classList.toggle("on", i === C[key]))); }

async function load() {
  await loadLang();
  buildDF();
  document.title = T("Orbit — Settings");
  startTranslating();
  try {
    S = await api("/api/state");
    C = typeof S.config === "string" ? JSON.parse(S.config) : S.config;
    showNow(S.now);
    applyTheme();
    const want = decodeURIComponent(location.hash.slice(1));
    if (PAGES.some(p => p.id === want)) current = want;
    render();
    setConn(true);
  } catch (e) {
    setConn(false);
    document.getElementById("main").innerHTML = "<h1>" + esc(T("Can't reach Orbit")) + "</h1><p class='sub'>" + esc(T("Is it still running? Open the settings again from the tray icon.")) + "</p>";
  }
}
setInterval(async () => {
  try { const st = await api("/api/state"); if (S && JSON.stringify(st.weather) !== JSON.stringify(S.weather)) { S.weather = st.weather; refreshLive(); } const cn = document.getElementById("conn"); if (cn && cn.classList.contains("bad")) setConn(true); showNow(st.now); S.editMode = st.editMode; const t = document.getElementById("editToggle"); if (t) t.checked = st.editMode; } catch (e) { setConn(false); }
}, 2000);
load();
